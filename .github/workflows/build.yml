name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Test -Render
      - name: Upload portable builds and previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ROTK-CPU-Manager
          path: |
            dist/*-portable.zip
            dist/preview*.png
          if-no-files-found: error
          retention-days: 14
